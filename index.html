<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>张佳聪｜宣传内容创作与视觉传播</title>
  <style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#142235;color:#f9f6ef;font:16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.loading{text-align:center}.loading b{display:block;font-size:28px;margin-bottom:8px}</style>
</head>
<body>
  <div class="loading"><b>张佳聪 · 视觉传播作品集</b><span>正在载入作品，请稍候…</span></div>
  <script>
    (function () {
      var source = 'https://raw.githubusercontent.com/zjc004006/portfolio-site/3b8f3e720521a3183eaf7efaa6d6234cf7cc56d0/index.html';
      fetch(source).then(function (response) {
        if (!response.ok) throw new Error('load failed');
        return response.text();
      }).then(function (html) {
        var passwordScript = '<script>(function(){var gate=document.getElementById("accessGate");var form=document.getElementById("accessForm");var input=document.getElementById("accessPassword");var message=document.getElementById("accessMessage");function unlock(){document.body.classList.remove("locked");gate.hidden=true;gate.style.display="none";}form.addEventListener("submit",function(event){event.preventDefault();if(input.value==="jiacongzhang"){unlock();}else{message.textContent="密码不正确，请重新输入。";input.select();}});}());</' + 'script>';
        html = html.replace(/\s*<script>[\s\S]*?<\/script>\s*<\/body>/, '\n</body>');
        html = html.replace('</section>\n    <header class="site-header">', '</section>\n' + passwordScript + '\n    <header class="site-header">');
        document.open();
        document.write(html);
        document.close();
      }).catch(function () {
        document.body.innerHTML = '<div class="loading"><b>暂时无法载入作品</b><span>请刷新页面后重试。</span></div>';
      });
    }());
  </script>
</body>
</html>
